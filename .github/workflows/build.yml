on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build
        run: ./gradlew assembleRelease

      - name: Lint (API level report, does not fail the build)
        continue-on-error: true
        run: |
          ./gradlew lintRelease
          REPORT=app/stdout
          if [ -f "$REPORT" ]; then
            echo "::group::API level issues (NewApi / InlinedApi)"
            grep -E -A4 "\[(NewApi|InlinedApi)\]" "$REPORT" || echo "No API level issues"
            echo "::endgroup::"
            tail -n 3 "$REPORT"
          fi

      - name: Sign APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "Using build tools: $BUILD_TOOLS"

          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Signing with repository secrets"
            echo "$KEYSTORE_FILE" | base64 -d > keystore.jks
          else
            # No secrets configured (e.g. a fork): use the public sideload test key.
            # Fine for personal installs, NOT for publishing.
            echo "Signing with public sideload key (ci/sideload.jks)"
            cp ci/sideload.jks keystore.jks
            KEYSTORE_PASSWORD=sideload-public
            KEY_ALIAS=sideload
            KEY_PASSWORD=sideload-public
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out volume-manager.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs volume-manager.apk
          rm -f keystore.jks

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: volume-manager.apk
          archive: false
